# Charity Billionaire — Cloudflare Worker keeper (reliable primary trigger).
# Runs on Cloudflare's scheduler (dependable, unlike GitHub free-tier cron) and signs the
# permissionless requestDraw() itself. The signing key lives ONLY in an encrypted Worker
# Secret (set with: wrangler secret put KEEPER_PRIVATE_KEY) — never in this repo.
name = "charity-draw-keeper"
main = "src/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
account_id = "17fdaf95ef14ae0870828824b66af8e0"

# DST-safe pair = Thursday 9:01 PM ET year-round. 9:01 sits between GitHub's nominal 9:00
# and the Pi's 9:03, so the layers don't fire the same second. requestDraw reverts if not
# due, so the off-season run each half-year is a harmless no-op.
[triggers]
crons = ["1 1 * * 5", "1 2 * * 5"]
