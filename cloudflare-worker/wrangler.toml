# Charity Billionaire — Cloudflare Worker keeper (reliable primary trigger).
# Runs on Cloudflare's scheduler (dependable, unlike GitHub free-tier cron) and signs the
# permissionless DrawUpkeep2.performUpkeep() itself (draw trigger + stale-VRF self-heal +
# charity forward). The signing key lives ONLY in an encrypted Worker Secret (set with:
# wrangler secret put KEEPER_PRIVATE_KEY) — never in this repo.
name = "charity-draw-keeper"
main = "src/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
account_id = "17fdaf95ef14ae0870828824b66af8e0"

# Run EVERY 5 MINUTES. This guarantees the draw fires within ~5 min of its Thursday 21:00 ET
# due time (in both EDT/EST — no day-of-week/UTC-offset math to get wrong), and it lets the
# on-chain keeper self-heal a stalled VRF request and forward the charity slice promptly.
# checkUpkeep() gates every run, so the ~288 daily ticks are cheap no-op reads unless work is
# genuinely due; performUpkeep is permissionless + internally guarded, so no double-draw is
# possible. (The old "1 1 */ 1 2" daily pair only checked twice a day and could not recover a
# stall for up to ~24h — the every-5-min cadence is what makes "never >5 min late" real.)
[triggers]
crons = ["*/5 * * * *"]

# Persist Worker logs so scheduled (cron) runs are auditable — previously disabled, which is
# why the mis-firing above was invisible. Mirrors the dashboard Observability setting.
[observability]
enabled = true
[observability.logs]
enabled = true
invocation_logs = true
persist = true
